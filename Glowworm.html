<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glowworm</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04141f;--cyan:#38f2d0;--pink:#ff4fa3;--gold:#ffd166;--ink:#d8f3f0;--dim:#7fb0b4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;background:radial-gradient(120% 90% at 50% 0%,var(--b1,#0b3a4d) 0%,var(--b2,#04141f) 62%);color:var(--ink);
font-family:Unbounded,"Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#hud{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
#hud div{display:flex;flex-direction:column;gap:2px}
#hud small{font-size:10px;color:var(--dim);font-weight:500}
#hud b{font-size:clamp(16px,4.5vw,24px);font-weight:800;font-variant-numeric:tabular-nums}
#cb{min-width:44px;text-align:center;color:var(--gold);font-weight:800;font-size:15px;opacity:0;transition:opacity .2s}
#cb.on{opacity:1}
#mute,#pz{background:none;border:1px solid #2a6470;color:var(--ink);border-radius:8px;padding:6px 10px;font:500 11px Unbounded,system-ui,sans-serif;cursor:pointer}
#mute:focus-visible,#pz:focus-visible,#ob:focus-visible,.chip:focus-visible,#go:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
#wrap{position:relative;border-radius:18px;box-shadow:0 0 0 1px #1d5663,0 0 60px #38f2d022,0 30px 80px #000a}
canvas{display:block;border-radius:18px}
#ov{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:#031019cc;backdrop-filter:blur(4px);padding:20px}
#ov.hide{display:none}
#ov h1{margin:0;font-size:clamp(30px,9vw,54px);font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
#ov p{margin:0;max-width:30ch;font-size:13px;line-height:1.6;color:var(--dim);font-weight:500}
#go{font:800 15px Unbounded,system-ui,sans-serif;color:#03221e;background:var(--cyan);border:0;border-radius:999px;padding:14px 34px;cursor:pointer;box-shadow:0 0 28px #38f2d088;transition:transform .12s}
#go:active{transform:scale(.95)}
#pz:disabled{opacity:.35;cursor:default}
#ov{overflow-y:auto;justify-content:safe center}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#ob{font:500 13px Unbounded,system-ui,sans-serif;color:var(--ink);background:none;border:1px solid #2a6470;border-radius:999px;padding:13px 22px;cursor:pointer}
#opts{display:none;flex-direction:column;gap:10px;width:100%;max-width:420px}
#ov.opt #opts{display:flex}#ov.opt p{display:none}
.row{display:flex;flex-direction:column;gap:5px;align-items:center}.row>span{font-size:11px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 11px Unbounded,system-ui,sans-serif;color:var(--ink);background:#0a2a36;border:1px solid #1d5663;border-radius:999px;padding:6px 11px;cursor:pointer}
.chip i{width:14px;height:14px;border-radius:50%;display:block;box-shadow:0 0 0 1px #fff3}
.chip[aria-pressed=true]{border-color:var(--cyan);background:#0e4a52;box-shadow:0 0 12px #38f2d044}
</style>
</head>
<body>
<div id="hud">
  <div><small>Score</small><b id="sc">0</b></div>
  <div><small>Best</small><b id="bs">0</b></div>
  <div><small>Level</small><b id="lv">1</b></div>
  <div id="cb">x2</div>
  <button id="pz" aria-label="Pause or resume" disabled>Pause</button>
  <button id="mute" aria-label="Toggle sound">Sound on</button>
</div>
<div id="wrap">
  <canvas id="c" aria-label="Snake game board"></canvas>
  <div id="ov">
    <h1 id="t">Glowworm</h1>
    <p id="m">Eat the glow, chain it for combos, and stay out of the dark. Arrow keys, WASD or swipe to steer. Space pauses.</p>
    <div class="btns"><button id="go">Play</button><button id="ob">Options</button></div>
    <div id="opts"></div>
  </div>
</div>
<script>
const N=22,$=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),ov=$('ov');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let S,dpr,cell;
function resize(){S=Math.max(240,Math.min(innerWidth-24,innerHeight-170,640));dpr=devicePixelRatio||1;
cv.width=cv.height=Math.round(S*dpr);cv.style.width=cv.style.height=S+'px';$('hud').style.width=S+'px';cell=S/N}
addEventListener('resize',resize);resize();

/* ---------- audio ---------- */
let AC,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',v=.15,slide=0,delay=0){if(muted)return;const a=ac();if(!a)return;
const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v){if(muted)return;const a=ac();if(!a)return;const n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);
for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);
const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
g.gain.value=v;s.buffer=b;s.connect(f).connect(g).connect(a.destination);s.start()}
const SC=[0,2,4,7,9,12,14,16];
const sfx={
eat(c){const f=392*2**(SC[Math.min(c-1,7)]/12);tone(f,.13,'triangle',.22);tone(f*2,.2,'sine',.1,0,.06)},
bonus(){[0,4,7,12,16].forEach((s,i)=>tone(523*2**(s/12),.16,'square',.07,0,i*.06))},
turn(){tone(190,.03,'square',.025)},
level(){[0,5,9,12].forEach((s,i)=>tone(440*2**(s/12),.14,'triangle',.14,0,i*.07))},
start(){[0,7,12].forEach((s,i)=>tone(330*2**(s/12),.18,'sine',.16,0,i*.09))},
die(){tone(260,.7,'sawtooth',.2,-220);tone(130,.8,'square',.1,-90,.05);noise(.5,.35)},
spawn(){tone(900,.08,'sine',.06,300)}};

/* ---------- state ---------- */
let snake,old,dir,queue,food,bonus,pend,score,eaten,level,combo,comboT,interval,acc,state='menu',shake=0,best=0,T=0;
try{best=+localStorage.getItem('glowworm-best')||0}catch(e){}
$('bs').textContent=best;
let cfg={food:'orb',snake:'aurora',bg:'sea',speed:'normal'};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('glowworm-cfg'))||{})}catch(e){}
const SK={aurora:[165,315],ember:[5,55],ocean:[185,255],violet:[265,335],rainbow:[0,300]};
const BG={sea:['#08283a','#020b12','#0b3a4d'],midnight:['#1b1858','#05030f','#1f1a6b'],forest:['#0f3d2b','#020d08','#145238'],plum:['#41114a','#0d0212','#561a60']};
const FHUE={orb:330,apple:355,star:50,fish:195,gem:280};
const SPD={slow:180,normal:140,fast:105,insane:80};
function calcInt(){const b=SPD[cfg.speed]||140,lv=level||1;return Math.max(b*.55,b-(lv-1)*Math.round(b*.065))}
const parts=[],floats=[],bubbles=Array.from({length:26},()=>({x:Math.random(),y:Math.random(),r:1+Math.random()*3,s:.01+Math.random()*.03}));

function reset(){snake=[{x:11,y:11},{x:10,y:11},{x:9,y:11},{x:8,y:11}];old=snake.map(s=>({...s}));dir={x:1,y:0};queue=[];
pend=0;score=0;eaten=0;level=1;combo=0;comboT=0;interval=calcInt();acc=0;bonus=null;parts.length=0;floats.length=0;food=free();hud()}
function free(){let p;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}
while(snake.some(s=>s.x===p.x&&s.y===p.y)||(food&&food.x===p.x&&food.y===p.y)||(bonus&&bonus.x===p.x&&bonus.y===p.y));return p}
function hud(){$('sc').textContent=score;$('lv').textContent=level;const c=$('cb');c.textContent='x'+combo;c.classList.toggle('on',combo>1)}

function burst(x,y,hue,n,sp=3){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(.4+Math.random())*sp;
parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,max:.5+Math.random()*.6,hue:hue+Math.random()*30-15,r:1+Math.random()*3})}}
const px=p=>(p.x+.5)*cell,py=p=>(p.y+.5)*cell;

function step(){
if(queue.length)dir=queue.shift();
const h={x:(snake[0].x+dir.x+N)%N,y:(snake[0].y+dir.y+N)%N};
const eatF=h.x===food.x&&h.y===food.y,eatB=bonus&&h.x===bonus.x&&h.y===bonus.y;
const grows=eatF||eatB||pend>0;
const body=grows?snake:snake.slice(0,-1);
if(body.some(s=>s.x===h.x&&s.y===h.y)){die();return}
old=snake.map(s=>({x:s.x,y:s.y}));snake.unshift(h);
if(eatF){combo=comboT>0?combo+1:1;comboT=3200;const pts=10*combo*level;score+=pts;eaten++;pend++;
burst(px(h),py(h),FHUE[cfg.food],22);floats.push({x:px(h),y:py(h),t:1,s:'+'+pts,c:'#ff9fd0'});sfx.eat(combo);shake=RM?0:3;
const nl=1+Math.floor(eaten/5);if(nl>level){level=nl;interval=calcInt();setTimeout(sfx.level,150);floats.push({x:S/2,y:S/2,t:1.6,s:'Level '+level,c:'#38f2d0',big:1})}
food=free();if(eaten%6===0&&!bonus){bonus={...free(),t:6000};sfx.spawn()}hud()}
if(eatB){score+=50*level;pend+=3;burst(px(h),py(h),45,40,4.5);floats.push({x:px(h),y:py(h),t:1.2,s:'+'+50*level,c:'#ffd166'});sfx.bonus();bonus=null;shake=RM?0:6;hud()}
if(pend>0)pend--;else snake.pop();
if(!eatF&&!eatB&&pend>=0&&snake.length<old.length+1&&false){}
}
function die(){state='over';sfx.die();shake=RM?0:16;
snake.forEach((s,i)=>{const k=SK[cfg.snake];burst(px(s),py(s),k[0]+(k[1]-k[0])*i/snake.length,3,4)});
let nb=false;if(score>best){best=score;nb=true;try{localStorage.setItem('glowworm-best',best)}catch(e){}$('bs').textContent=best}
setTimeout(()=>{if(state!=='over')return;$('t').textContent='Game over';
$('m').textContent=`You scored ${score} and reached level ${level}.`+(nb?' That is a new best.':` Your best is ${best}.`);
$('go').textContent='Play again';ov.classList.remove('hide');$('go').focus()},700)}
function start(){ac();reset();state='play';ov.classList.add('hide');sfx.start();lastT=performance.now()}
function pause(){if(state==='play'){state='pause';$('t').textContent='Paused';$('m').textContent='Take a breath. Space or the button resumes.';$('go').textContent='Resume';ov.classList.remove('hide')}
else if(state==='pause'){state='play';ov.classList.add('hide');lastT=performance.now()}}

/* ---------- input ---------- */
function turn(dx,dy){if(state!=='play'){if(state==='menu'||state==='over'){if(ov.classList.contains('hide')===false&&state==='over')return;start()}return}
const l=queue.length?queue[queue.length-1]:dir;
if((dx===-l.x&&dy===-l.y)||(dx===l.x&&dy===l.y)||queue.length>=2)return;queue.push({x:dx,y:dy});sfx.turn()}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
const m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
if(m){e.preventDefault();turn(...m)}
else if(k===' '){if(e.target.tagName==='BUTTON')return;e.preventDefault();if(state==='play'||state==='pause')pause();else start()}
else if(k==='m')toggleMute();else if(k==='p'||k==='escape')pause()});
$('go').addEventListener('click',()=>{state==='pause'?pause():start()});
function toggleMute(){muted=!muted;$('mute').textContent=muted?'Sound off':'Sound on'}
$('mute').addEventListener('click',e=>{e.stopPropagation();toggleMute();e.target.blur()});
let tx,ty;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchmove',e=>{if(tx==null)return;const dx=e.touches[0].clientX-tx,dy=e.touches[0].clientY-ty;
if(Math.hypot(dx,dy)>26){Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy));tx=e.touches[0].clientX;ty=e.touches[0].clientY}},{passive:true});
addEventListener('touchend',()=>{tx=null});

/* ---------- render ---------- */
function draw(t){
ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,S,S);
const g=ctx.createRadialGradient(S/2,S*.4,S*.1,S/2,S/2,S*.8);g.addColorStop(0,BG[cfg.bg][0]);g.addColorStop(1,BG[cfg.bg][1]);
ctx.fillStyle=g;ctx.fillRect(0,0,S,S);
ctx.save();if(shake>.1)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
// grid dots
ctx.fillStyle='#2f8d9a22';for(let i=0;i<N;i++)for(let j=0;j<N;j++){ctx.beginPath();ctx.arc((i+.5)*cell,(j+.5)*cell,1.2,0,6.283);ctx.fill()}
// bubbles
ctx.fillStyle='#8ff';for(const b of bubbles){ctx.globalAlpha=.12;ctx.beginPath();ctx.arc(b.x*S+Math.sin(T/900+b.s*99)*8,b.y*S,b.r,0,6.283);ctx.fill()}ctx.globalAlpha=1;
if(!snake){ctx.restore();return}
// food
const pul=Math.sin(T/160);drawOrb(px(food),py(food),cell*(.27+.04*pul),FHUE[cfg.food],pul,cfg.food);
if(bonus){const k=bonus.t/6000;drawOrb(px(bonus),py(bonus),cell*(.34+.05*pul),45,pul);
ctx.strokeStyle='#ffd166';ctx.lineWidth=2;ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(px(bonus),py(bonus),cell*.62,-1.57,-1.57+6.283*k);ctx.stroke();ctx.globalAlpha=1}
// snake
const f=state==='play'?Math.min(1,acc/interval):1,L=snake.length,P=[];
for(let i=0;i<L;i++){const a=old[Math.min(i,old.length-1)],b=snake[i];P.push({x:wm(a.x+wd(b.x-a.x)*f+.5)*cell,y:wm(a.y+wd(b.y-a.y)*f+.5)*cell})}
if(state!=='over'||L){ctx.lineCap='round';ctx.lineJoin='round';
for(let i=L-1;i>=1;i--){const[h0,h1]=SK[cfg.snake];const c=`hsl(${h0+(h1-h0)*i/L},95%,${62-i/L*10}%)`;ctx.strokeStyle=c;ctx.shadowColor=c;ctx.shadowBlur=cell*.7;
ctx.lineWidth=Math.max(cell*.42,cell*(.8-.34*i/L));{const a=P[i],b=P[i-1];let ox=0,oy=0;if(Math.abs(b.x-a.x)>S/2)ox=Math.sign(b.x-a.x)*S;if(Math.abs(b.y-a.y)>S/2)oy=Math.sign(b.y-a.y)*S;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x-ox,b.y-oy);if(ox||oy){ctx.moveTo(a.x+ox,a.y+oy);ctx.lineTo(b.x,b.y)}ctx.stroke()}}
ctx.shadowBlur=0;
if(state!=='over')for(const[ox,oy] of wrapOffs(P[0])){ctx.save();ctx.translate(ox,oy);{const h=P[0],hr=cell*.5;const hc=SK[cfg.snake][0];ctx.fillStyle=`hsl(${hc},100%,88%)`;ctx.shadowColor=`hsl(${hc},100%,60%)`;ctx.shadowBlur=cell;
ctx.beginPath();ctx.arc(h.x,h.y,hr,0,6.283);ctx.fill();ctx.shadowBlur=0;
const dx=dir.x,dy=dir.y;for(const s of[-1,1]){const ex=h.x+dx*hr*.35-dy*s*hr*.45,ey=h.y+dy*hr*.35+dx*s*hr*.45;
ctx.fillStyle='#031019';ctx.beginPath();ctx.arc(ex,ey,hr*.27,0,6.283);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex+dx*1.2,ey+dy*1.2,hr*.1,0,6.283);ctx.fill()}}ctx.restore()}}
// particles
ctx.globalCompositeOperation='lighter';
for(const p of parts){ctx.fillStyle=`hsla(${p.hue},100%,62%,${Math.max(0,p.life)})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life+.3,0,6.283);ctx.fill()}
ctx.globalCompositeOperation='source-over';
// floating text
ctx.textAlign='center';for(const q of floats){ctx.globalAlpha=Math.min(1,q.t);ctx.fillStyle=q.c;ctx.font=`800 ${q.big?cell*1.4:cell*.7}px Unbounded,system-ui,sans-serif`;ctx.fillText(q.s,q.x,q.y-(1.6-q.t)*30)}ctx.globalAlpha=1;
ctx.restore();
// vignette
const v=ctx.createRadialGradient(S/2,S/2,S*.45,S/2,S/2,S*.78);v.addColorStop(0,'#0000');v.addColorStop(1,'#000a');ctx.fillStyle=v;ctx.fillRect(0,0,S,S)}
const wd=d=>d>1?d-N:d<-1?d+N:d,wm=v=>(v%N+N)%N;
function wrapOffs(h){const q=cell*.7,xs=[0],ys=[0];if(h.x<q)xs.push(S);if(h.x>S-q)xs.push(-S);if(h.y<q)ys.push(S);if(h.y>S-q)ys.push(-S);
const o=[];for(const x of xs)for(const y of ys)o.push([x,y]);return o}
function shape(k,x,y,r){ctx.beginPath();
if(k==='star'){for(let i=0;i<10;i++){const a=-1.57+i*Math.PI/5,q=i%2?r*.55:r*1.45;ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}ctx.closePath();ctx.fill()}
else if(k==='gem'){r*=1.3;ctx.moveTo(x,y-r);ctx.lineTo(x+r*.85,y);ctx.lineTo(x,y+r*1.1);ctx.lineTo(x-r*.85,y);ctx.closePath();ctx.fill()}
else if(k==='fish'){r*=1.1;x-=r*.4;ctx.ellipse(x,y,r*1.3,r*.8,0,0,6.283);ctx.moveTo(x+r*1.1,y);ctx.lineTo(x+r*2,y-r*.8);ctx.lineTo(x+r*2,y+r*.8);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#031019';ctx.beginPath();ctx.arc(x-r*.6,y-r*.15,r*.18,0,6.283);ctx.fill()}
else{ctx.arc(x,y,r,0,6.283);ctx.fill();if(k==='apple'){ctx.shadowBlur=0;ctx.fillStyle='#7dffb0';ctx.beginPath();ctx.ellipse(x+r*.4,y-r*1.05,r*.45,r*.22,-.6,0,6.283);ctx.fill()}}}
function drawOrb(x,y,r,hue,pul,kind='orb'){const h=ctx.createRadialGradient(x,y,0,x,y,cell*1.1);h.addColorStop(0,`hsla(${hue},100%,60%,.55)`);h.addColorStop(1,`hsla(${hue},100%,60%,0)`);
ctx.fillStyle=h;ctx.beginPath();ctx.arc(x,y,cell*1.1,0,6.283);ctx.fill();
ctx.fillStyle=`hsl(${hue},100%,${80+pul*6}%)`;ctx.shadowColor=`hsl(${hue},100%,60%)`;ctx.shadowBlur=cell*.8;shape(kind,x,y,r);ctx.shadowBlur=0;
for(let i=0;i<2;i++){const a=T/400+i*3.14;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+Math.cos(a)*cell*.5,y+Math.sin(a)*cell*.5,1.5,0,6.283);ctx.fill()}}

/* ---------- options ---------- */
const OPT={food:['Food',{orb:'Glow orb',apple:'Apple',star:'Star',fish:'Fish',gem:'Gem'}],snake:['Snake colour',{aurora:'Aurora',ember:'Ember',ocean:'Ocean',violet:'Violet',rainbow:'Rainbow'}],bg:['Background',{sea:'Deep sea',midnight:'Midnight',forest:'Forest',plum:'Plum'}],speed:['Speed',{slow:'Slow',normal:'Normal',fast:'Fast',insane:'Insane'}]};
function sw(k,v){if(k==='snake'){const[a,b]=SK[v];return `linear-gradient(90deg,hsl(${a},95%,60%),hsl(${b},95%,55%))`}if(k==='bg')return `linear-gradient(135deg,${BG[v][2]},${BG[v][1]})`;return ''}
function applyBg(){const r=document.documentElement.style,b=BG[cfg.bg]||BG.sea;r.setProperty('--b1',b[2]);r.setProperty('--b2',b[1])}
function buildOpts(){const o=$('opts');for(const k in OPT){const row=document.createElement('div');row.className='row';row.innerHTML=`<span>${OPT[k][0]}</span>`;
const cs=document.createElement('div');cs.className='chips';
for(const v in OPT[k][1]){const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed',cfg[k]===v);const s=sw(k,v);
b.innerHTML=(s?`<i style="background:${s}"></i>`:'')+OPT[k][1][v];
b.onclick=()=>{cfg[k]=v;try{localStorage.setItem('glowworm-cfg',JSON.stringify(cfg))}catch(e){}
cs.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b));
if(k==='speed')interval=calcInt();if(k==='bg')applyBg();tone(520,.06,'sine',.08)};cs.append(b)}
row.append(cs);o.append(row)}}
buildOpts();applyBg();
$('ob').onclick=()=>{const on=ov.classList.toggle('opt');$('ob').textContent=on?'Hide options':'Options'};
$('pz').addEventListener('click',e=>{pause();e.currentTarget.blur()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});

/* ---------- loop ---------- */
let lastT=performance.now();
function frame(now){const dt=Math.min(50,now-lastT);lastT=now;T=now;
if(state==='play'){acc+=dt;while(acc>=interval&&state==='play'){acc-=interval;step()}
if(comboT>0){comboT-=dt;if(comboT<=0){combo=0;hud()}}
if(bonus){bonus.t-=dt;if(bonus.t<=0)bonus=null}
// trail sparkle
if(snake&&Math.random()<.35){const s=snake[snake.length-1];parts.push({x:px(s),y:py(s),vx:(Math.random()-.5),vy:-.4-Math.random()*.5,life:1,max:1,hue:SK[cfg.snake][1],r:1.5})}}
for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;p.life-=dt/1000/p.max}
for(let i=parts.length-1;i>=0;i--)if(parts[i].life<=0)parts.splice(i,1);
for(const q of floats)q.t-=dt/900;for(let i=floats.length-1;i>=0;i--)if(floats[i].t<=0)floats.splice(i,1);
for(const b of bubbles){b.y-=b.s*dt/1000;if(b.y<-.02){b.y=1.02;b.x=Math.random()}}
shake*=.88;const pl=state==='pause'?'Resume':'Pause';if($('pz').textContent!==pl)$('pz').textContent=pl;$('pz').disabled=state==='menu'||state==='over';draw(now);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
